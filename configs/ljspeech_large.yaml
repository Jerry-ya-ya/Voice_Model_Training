experiment:
  name: ljspeech_large_v2
  output_dir: runs

data:
  dataset: ljspeech
  root: data/LJSpeech-1.1
  download: false
  cache_dir: data/cache/ljspeech
  validation_fraction: 0.02
  max_items: null
  num_workers: 2

audio:
  sample_rate: 22050
  n_fft: 1024
  win_length: 1024
  hop_length: 256
  n_mels: 80
  f_min: 0
  f_max: 8000

model:
  hidden_dim: 256
  encoder_layers: 4
  decoder_layers: 4
  attention_heads: 4
  dropout: 0.1
  max_mel_frames: 1200

training:
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.000001
  lr_decay: 0.99
  epochs: 150
  seed: 42
  device: cuda
  grad_clip: 1.0
  checkpoint_every: 5
  sample_every: 5
  duration_loss_weight: 0.1

vocoder:
  backend: hifigan
